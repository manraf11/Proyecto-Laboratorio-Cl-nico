<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Laboratorio Clínico - Bioanalista</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #eef2f7;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ============================================
       FONDO CON ELEMENTOS BIOLÓGICOS (ESTÁTICOS)
    ============================================ */
    .bg-biologico {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .globulo-rojo-bg {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 40% 30%, rgba(180, 40, 40, 0.04), rgba(140, 30, 30, 0.02));
      border: 1px solid rgba(180, 40, 40, 0.02);
      pointer-events: none;
      box-shadow: inset -5px -5px 15px rgba(0,0,0,0.01), inset 5px 5px 15px rgba(255,255,255,0.02);
    }
    .globulo-rojo-bg::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 30%;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05), transparent);
      pointer-events: none;
    }
    .globulo-rojo-bg::after {
      content: '';
      position: absolute;
      bottom: 25%;
      right: 25%;
      width: 20%;
      height: 20%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.02), transparent);
      pointer-events: none;
    }

    .bacteria-baston-bg {
      position: absolute;
      border-radius: 50px;
      background: linear-gradient(135deg, rgba(60, 120, 80, 0.03), rgba(40, 80, 60, 0.015));
      border: 1px solid rgba(60, 120, 80, 0.015);
      pointer-events: none;
      box-shadow: inset 0 2px 8px rgba(255,255,255,0.01);
    }
    .bacteria-baston-bg::before {
      content: '';
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 30%;
      border-radius: 50px;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.03), transparent);
      pointer-events: none;
    }

    .celula-nucleo-bg {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 35% 30%, rgba(100, 80, 160, 0.025), rgba(70, 50, 120, 0.01));
      border: 1px solid rgba(100, 80, 160, 0.015);
      pointer-events: none;
      box-shadow: inset -3px -3px 10px rgba(0,0,0,0.01);
    }
    .celula-nucleo-bg .nucleo-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(100, 80, 160, 0.03), rgba(70, 50, 120, 0.01));
      border: 1px solid rgba(100, 80, 160, 0.01);
      pointer-events: none;
    }
    .celula-nucleo-bg .nucleolo-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(120, 100, 180, 0.02), rgba(80, 60, 140, 0.01));
      border: 1px solid rgba(120, 100, 180, 0.01);
      pointer-events: none;
    }

    .hemacie-bg {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 45% 35%, rgba(200, 60, 60, 0.025), rgba(150, 40, 40, 0.01));
      border: 1px solid rgba(200, 60, 60, 0.01);
      pointer-events: none;
      box-shadow: inset -3px -3px 8px rgba(0,0,0,0.01), inset 3px 3px 8px rgba(255,255,255,0.01);
    }

    .dna-molecula-bg {
      position: absolute;
      pointer-events: none;
      opacity: 0.08;
    }
    .dna-molecula-bg svg {
      width: 100%;
      height: 100%;
    }

    /* ============================================
       CONTENIDO PRINCIPAL
    ============================================ */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      padding: 0 4px;
    }

    .panel {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      overflow: hidden;
      border: 1px solid #dce4ec;
    }

    .panel-header {
      background: #1a5f7a;
      color: white;
      padding: 16px 20px;
      text-align: center;
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 12px;
      border-bottom: 3px solid #ffc107;
    }

    .btn-cerrar-sesion {
      background: rgba(255, 0, 0, 0.2);
      color: white;
      border: 2px solid rgba(255, 0, 0, 0.5);
      padding: 6px 14px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.75rem;
      transition: all 0.3s ease;
      white-space: nowrap;
      order: 0;
      margin-right: auto;
      flex-shrink: 0;
    }
    .btn-cerrar-sesion:hover {
      background: rgba(255, 0, 0, 0.4);
      transform: translateY(-2px);
      border-color: #ff4444;
    }

    .panel-header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      order: 1;
      margin: 0;
    }
    .panel-header p {
      font-size: 0.8rem;
      opacity: 0.9;
      width: 100%;
      margin: 2px 0 0;
      order: 3;
    }

    .panel-content {
      padding: 20px 16px;
    }

    /* ===== BOTONES ===== */
    .btn-gestionar {
      background: #764ba2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.15s;
      float: right;
    }
    .btn-gestionar:hover { background: #5f3a8a; transform: scale(0.97); }

    .btn-azul {
      background: #2c9cd4;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.8rem;
      transition: 0.15s;
    }
    .btn-azul:hover { background: #1f7aa8; }

    .btn-verde {
      background: #28a745;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.8rem;
      transition: 0.15s;
    }
    .btn-verde:hover { background: #1e7e34; }

    .btn-amarillo {
      background: #ffc107;
      color: #333;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.8rem;
      transition: 0.15s;
    }
    .btn-amarillo:hover { background: #e0a800; }

    .btn-rojo {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.8rem;
      transition: 0.15s;
    }
    .btn-rojo:hover { background: #b02a37; }

    .btn-cerrar {
      background: #6c757d;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.15s;
    }
    .btn-cerrar:hover { background: #5a6268; }

    .btn-guardar {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.15s;
    }
    .btn-guardar:hover { background: #1e7e34; }

    .clearfix::after {
      content: "";
      clear: both;
      display: table;
    }

    /* ===== FILTROS ===== */
    .filtros {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid #dce4ec;
    }

    .filtro-estado {
      display: inline-block;
      margin-right: 20px;
      margin-bottom: 8px;
    }
    .filtro-estado label {
      font-weight: 500;
      font-size: 0.85rem;
      color: #1a5f7a;
    }
    .filtro-estado select {
      padding: 8px 12px;
      border: 1px solid #d0d9e3;
      border-radius: 10px;
      font-size: 0.85rem;
      background: white;
      margin-left: 6px;
    }

    .buscador {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .buscador span {
      font-weight: 500;
      font-size: 0.85rem;
      color: #1a5f7a;
    }
    .buscador input {
      flex: 1;
      min-width: 120px;
      padding: 8px 14px;
      border: 1px solid #d0d9e3;
      border-radius: 30px;
      font-size: 0.85rem;
      transition: 0.15s;
    }
    .buscador input:focus {
      outline: none;
      border-color: #1a5f7a;
      box-shadow: 0 0 0 3px rgba(26,95,122,0.15);
    }
    .buscador button {
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
    }

    /* ===== TABLA RESPONSIVE ===== */
    .tabla-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 6px 0;
      border-radius: 12px;
      border: 1px solid #e0e7ed;
      background: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 500px;
    }
    th {
      background: #1a5f7a;
      color: white;
      padding: 10px 10px;
      text-align: left;
      white-space: nowrap;
      font-size: 0.8rem;
    }
    td {
      padding: 10px 10px;
      border-bottom: 1px solid #eaeef3;
      word-break: break-word;
      font-size: 0.8rem;
      vertical-align: middle;
    }
    tr:hover { background: #f5f8fc; }
    tr:last-child td { border-bottom: none; }

    .badge-preparacion {
      background: #ffc107;
      color: #333;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      display: inline-block;
    }
    .badge-pendiente {
      background: #17a2b8;
      color: white;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      display: inline-block;
    }

    .resumen {
      background: #e8f5e9;
      padding: 8px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #1a5f7a;
      font-weight: 500;
      border-left: 4px solid #4caf50;
    }

    /* ===== MODALES ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1100;
      padding: 16px;
    }
    .modal-contenido {
      background: white;
      border-radius: 28px;
      width: 100%;
      max-width: 550px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 25px 60px rgba(0,0,0,0.2);
    }
    .modal-contenido-grande {
      max-width: 1000px;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      background: white;
      border-radius: 28px 28px 0 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 1.1rem; }
    .modal-header button {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: inherit;
      opacity: 0.7;
      transition: 0.15s;
    }
    .modal-header button:hover { opacity: 1; }
    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid #e0e7ed;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      background: white;
      border-radius: 0 0 28px 28px;
    }
    .modal-footer button { min-width: 80px; }

    .campo {
      margin-bottom: 16px;
    }
    .campo label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1a5f7a;
      font-size: 0.85rem;
    }
    .campo input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d0d9e3;
      border-radius: 12px;
      font-size: 0.9rem;
      transition: 0.15s;
    }
    .campo input:focus {
      outline: none;
      border-color: #1a5f7a;
      box-shadow: 0 0 0 3px rgba(26,95,122,0.15);
    }

    .error {
      color: #dc3545;
      background: #ffe8e5;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: none;
      font-size: 0.85rem;
    }

    .mensaje-vacio {
      text-align: center;
      padding: 30px 20px;
      color: #999;
      font-size: 0.9rem;
    }

    /* ===== LOADER ===== */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loader {
      border: 4px solid #e0e7ed;
      border-top: 4px solid #1a5f7a;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 700px) {
      .panel-header { flex-direction: column; align-items: center; text-align: center; }
      .btn-cerrar-sesion { margin-right: 0; order: 0; }
      .panel-header h1 { font-size: 1.3rem; order: 1; }
      .panel-header p { order: 2; }
      .btn-gestionar { float: none; display: inline-block; margin-bottom: 12px; }
      .filtro-estado { display: block; margin-right: 0; margin-bottom: 8px; }
      .buscador { flex-direction: column; align-items: stretch; }
      .buscador input { min-width: 0; }
      .buscador button { width: 100%; }
      .modal-contenido-grande { max-width: 100%; margin: 0 4px; }
      .modal-footer button { flex: 1; min-width: 60px; }
    }

    @media (max-width: 500px) {
      body { padding: 8px; }
      .panel-content { padding: 14px 10px; }
      .filtros { padding: 12px; }
      .btn-gestionar { font-size: 0.75rem; padding: 8px 16px; width: 100%; text-align: center; }
      table { font-size: 0.75rem; min-width: 380px; }
      th, td { padding: 8px 6px; }
      .modal { padding: 8px; }
      .modal-contenido { border-radius: 20px; max-width: 100%; }
      .modal-header { padding: 12px 14px; }
      .modal-header h3 { font-size: 0.95rem; }
      .modal-body { padding: 14px; }
      .modal-footer { padding: 10px 14px; }
      .campo input { padding: 7px 10px; font-size: 0.8rem; }
    }

    @media (max-width: 400px) {
      .panel-header h1 { font-size: 1.1rem; }
      .btn-cerrar-sesion { font-size: 0.6rem; padding: 4px 8px; }
      table { font-size: 0.7rem; min-width: 320px; }
      th, td { padding: 6px 4px; }
    }

    /* ===== TABLA EN TARJETAS PARA MÓVILES ===== */
    @media (max-width: 600px) {
      .tabla-wrapper {
        overflow-x: visible;
        border: none;
        background: transparent;
      }
      table {
        min-width: 0;
        display: block;
        border: none;
      }
      table thead {
        display: none;
      }
      table tbody {
        display: block;
      }
      table tr {
        display: block;
        background: white;
        border-radius: 14px;
        border: 1px solid #dce4ec;
        padding: 12px 14px;
        margin-bottom: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      }
      table tr:hover { background: white; }
      table td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px dashed #eaeef3;
        font-size: 0.78rem;
        gap: 8px;
      }
      table td:last-child { border-bottom: none; }
      table td::before {
        content: attr(data-label);
        font-weight: 600;
        color: #1a5f7a;
        flex-shrink: 0;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.2px;
        width: 40%;
      }
      table td:has(.btn-azul, .btn-amarillo, .btn-rojo, .btn-verde) {
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px;
      }
      table td:has(.btn-azul, .btn-amarillo, .btn-rojo, .btn-verde)::before {
        content: "Acciones";
        width: 40%;
      }
      .badge-preparacion, .badge-pendiente {
        font-size: 0.65rem;
        padding: 2px 10px;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================
       FONDO CON ELEMENTOS BIOLÓGICOS ESTÁTICOS
  ============================================ -->
  <div class="bg-biologico" id="bgCanvas"></div>

  <div class="container">
    <div class="panel">
      <div class="panel-header">
        <button id="btnCerrarSesion" class="btn-cerrar-sesion">🚪 Cerrar Sesión</button>
        <h1>🔬 Laboratorio Clínico</h1>
        <p>BIOANÁLISIS · Gestión de Resultados</p>
      </div>
      <div class="panel-content">
        <div id="cargando" style="text-align: center; padding: 40px;">
          <div class="loader"></div>
          <p style="margin-top: 12px; color: #1a5f7a; font-weight: 500;">Cargando...</p>
        </div>
        <div id="contenido" style="display: none;">
          <div class="clearfix">
            <button id="btnGestionarEstudios" class="btn-gestionar">📚 Gestionar Estudios</button>
          </div>

          <div class="filtros">
            <div class="filtro-estado">
              <label>Filtrar por estado:</label>
              <select id="selectEstado">
                <option value="todos">📋 Todos</option>
                <option value="preparacion">⚙️ En Preparación</option>
                <option value="pendiente">⏳ Pendiente</option>
              </select>
            </div>
            <div class="buscador">
              <span>🔎 Buscar por ID:</span>
              <input type="text" id="inputBuscarId" placeholder="Ej: a1b2c3">
              <button id="btnBuscar" class="btn-azul">Buscar</button>
              <button id="btnLimpiar" class="btn-cerrar">Limpiar</button>
            </div>
          </div>

          <div id="listaPendientes"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL GESTIONAR ESTUDIOS -->
  <div id="modalEstudios" class="modal">
    <div class="modal-contenido modal-contenido-grande">
      <div class="modal-header" style="background: #764ba2; color: white; border-radius: 28px 28px 0 0;">
        <h3 style="color: white;">📚 Gestión de Estudios</h3>
        <button id="cerrarModalEstudios" style="color: white;">✖️</button>
      </div>
      <div class="modal-body">
        <div style="text-align: right; margin-bottom: 15px;">
          <button id="btnAbrirNuevoEstudio" class="btn-verde">➕ Nuevo Estudio</button>
        </div>
        <div id="tablaEstudios"></div>
      </div>
    </div>
  </div>

  <!-- MODAL NUEVO ESTUDIO -->
  <div id="modalNuevoEstudio" class="modal">
    <div class="modal-contenido">
      <div class="modal-header" style="background: #764ba2; color: white; border-radius: 28px 28px 0 0;">
        <h3 style="color: white;">🧪 Nuevo Estudio</h3>
        <button id="cerrarNuevoEstudio" style="color: white;">✖️</button>
      </div>
      <div class="modal-body">
        <div id="errorNuevo" class="error"></div>
        <div class="campo">
          <label>Nombre del estudio:</label>
          <input type="text" id="nuevoNombre" placeholder="Ej: Hemoglobina">
        </div>
        <div class="campo">
          <label>Precio ($):</label>
          <input type="number" id="nuevoPrecio" placeholder="Ej: 25">
        </div>
        <div class="campo">
          <label>Unidad de medida:</label>
          <input type="text" id="nuevoUnidad" placeholder="Ej: mg/dL">
        </div>
        <div class="campo">
          <label>Valores de referencia:</label>
          <input type="text" id="nuevoReferencia" placeholder="Ej: 4.0 - 5.6">
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelarNuevo" class="btn-cerrar">Cancelar</button>
        <button id="guardarNuevo" class="btn-guardar">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL EDITAR ESTUDIO -->
  <div id="modalEditarEstudio" class="modal">
    <div class="modal-contenido">
      <div class="modal-header" style="background: #ffc107; color: #333; border-radius: 28px 28px 0 0;">
        <h3>✏️ Editar Estudio</h3>
        <button id="cerrarEditar">✖️</button>
      </div>
      <div class="modal-body">
        <div id="errorEditar" class="error"></div>
        <div class="campo">
          <label>Nombre del estudio:</label>
          <input type="text" id="editarNombre">
        </div>
        <div class="campo">
          <label>Precio ($):</label>
          <input type="number" id="editarPrecio">
        </div>
        <div class="campo">
          <label>Unidad de medida:</label>
          <input type="text" id="editarUnidad">
        </div>
        <div class="campo">
          <label>Valores de referencia:</label>
          <input type="text" id="editarReferencia">
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelarEditar" class="btn-cerrar">Cancelar</button>
        <button id="guardarEditar" class="btn-guardar">Guardar</button>

        .forEach(([s,t,l]) => {

          n.className = 'nucleo-bg';

          Object.assign(n.style, {width:ns+'px', height:ns+'px'});

          nl.className = 'nucleolo-bg';
          const nls = ns * 0.35;

          n.appendChild(nl);
          d.appendChild(n);
          canvas.appendChild(d);

      // Hemacies
      [[30,5,10],[25,50,90],[35,80,5],[20,15,85],[28,45,55],[22,25,25],[32,70,70],[18,35,45],[26,55,20],[20,90,40],[30,10,50],[24,75,85]]
        .forEach(([s,t,l]) => add('hemacie-bg', {width:s+'px', height:s+'px', top:t+'%', left:l+'%'}));

      [[15,85,40],[60,5,35],[30,50,30],[80,65,45],[45,20,25],[70,40,38],[10,30,32],[90,80,28]]
        .forEach(([t,l,s]) => {
          const d = document.createElement('div');
          d.className = 'dna-molecula-bg';
          Object.assign(d.style, {top:t+'%', left:l+'%', width:s+'px', height:s+'px'});

          canvas.appendChild(d);

    })();

    // ============================================
    // VERIFICACIÓN DE SESIÓN - BIOANALISTA
    // ============================================
    (function verificarSesion() {
      const sesion = sessionStorage.getItem('labUser');
      if (!sesion) {
        window.location.href = 'indexlogin.html';
        return;
      }
      try {
        const datos = JSON.parse(sesion);
        if (!datos.rol || !datos.timestamp || Date.now() - datos.timestamp > 28800000 || datos.rol !== 'bioanalista') {
          sessionStorage.removeItem('labUser');
          window.location.href = 'indexlogin.html';
          return;
        }
      } catch (e) {
        sessionStorage.removeItem('labUser');
        window.location.href = 'indexlogin.html';
        return;
      }

      document.getElementById('btnCerrarSesion').addEventListener('click', function() {
        sessionStorage.removeItem('labUser');
        window.location.replace('indexlogin.html');
      });

      window.history.pushState(null, '', window.location.href);
      window.addEventListener('popstate', function() {
        if (!sessionStorage.getItem('labUser')) {
          window.location.replace('indexlogin.html');
        } else {
          window.history.pushState(null, '', window.location.href);
        }
      });
    })();
  </script>
