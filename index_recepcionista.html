<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Laboratorio Clínico - Recepcionista</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif; 
      background: #eef2f7; 
      min-height: 100vh; 
      padding: 16px; 
      position: relative;
      overflow-x: hidden;
    }

    /* ============================================
       FONDO CON ELEMENTOS BIOLÓGICOS (ESTÁTICOS)
    ============================================ */
    .bg-biologico {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .globulo-rojo-bg {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 40% 30%, rgba(180, 40, 40, 0.04), rgba(140, 30, 30, 0.02));
      border: 1px solid rgba(180, 40, 40, 0.02);
      pointer-events: none;
      box-shadow: inset -5px -5px 15px rgba(0,0,0,0.01), inset 5px 5px 15px rgba(255,255,255,0.02);
    }
    .globulo-rojo-bg::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 30%;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05), transparent);
      pointer-events: none;
    }
    .globulo-rojo-bg::after {
      content: '';
      position: absolute;
      bottom: 25%;
      right: 25%;
      width: 20%;
      height: 20%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.02), transparent);
      pointer-events: none;
    }

    .bacteria-baston-bg {
      position: absolute;
      border-radius: 50px;
      background: linear-gradient(135deg, rgba(60, 120, 80, 0.03), rgba(40, 80, 60, 0.015));
      border: 1px solid rgba(60, 120, 80, 0.015);
      pointer-events: none;
      box-shadow: inset 0 2px 8px rgba(255,255,255,0.01);
    }
    .bacteria-baston-bg::before {
      content: '';
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 30%;
      border-radius: 50px;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.03), transparent);
      pointer-events: none;
    }

    .celula-nucleo-bg {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 35% 30%, rgba(100, 80, 160, 0.025), rgba(70, 50, 120, 0.01));
      border: 1px solid rgba(100, 80, 160, 0.015);
      pointer-events: none;
      box-shadow: inset -3px -3px 10px rgba(0,0,0,0.01);
    }
    .celula-nucleo-bg .nucleo-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(100, 80, 160, 0.03), rgba(70, 50, 120, 0.01));
      border: 1px solid rgba(100, 80, 160, 0.01);
      pointer-events: none;
    }
    .celula-nucleo-bg .nucleolo-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(120, 100, 180, 0.02), rgba(80, 60, 140, 0.01));
      border: 1px solid rgba(120, 100, 180, 0.01);
      pointer-events: none;
    }

    .hemacie-bg {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 45% 35%, rgba(200, 60, 60, 0.025), rgba(150, 40, 40, 0.01));
      border: 1px solid rgba(200, 60, 60, 0.01);
      pointer-events: none;
      box-shadow: inset -3px -3px 8px rgba(0,0,0,0.01), inset 3px 3px 8px rgba(255,255,255,0.01);
    }

    .dna-molecula-bg {
      position: absolute;
      pointer-events: none;
      opacity: 0.08;
    }
    .dna-molecula-bg svg {
      width: 100%;
      height: 100%;
    }

    /* ============================================
       CONTENIDO PRINCIPAL
    ============================================ */
    .container { 
      max-width: 1200px; 
      margin: 0 auto; 
      position: relative;
      z-index: 1;
      padding: 0 4px;
    }
    .panel { 
      background: white; 
      border-radius: 20px; 
      box-shadow: 0 8px 30px rgba(0,0,0,0.08); 
      overflow: hidden; 
      border: 1px solid #dce4ec;
    }
    .panel-header { 
      background: linear-gradient(145deg, #1a5f7a 0%, #0d3f52 100%);
      color: white; 
      padding: 16px 20px; 
      text-align: center; 
      border-bottom: 3px solid #ffc107;
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 12px;
    }
    .panel-header h1 { 
      font-size: 1.5rem; 
      font-weight: 600;
      order: 1;
      margin: 0;
    }
    .panel-header p { 
      font-size: 0.8rem; 
      margin: 2px 0 0;
      opacity: 0.9;
      width: 100%;
      order: 3;
    }

    .btn-cerrar-sesion {
      background: rgba(255, 0, 0, 0.2);
      color: white;
      border: 2px solid rgba(255, 0, 0, 0.5);
      padding: 6px 14px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.75rem;
      transition: all 0.3s ease;
      white-space: nowrap;
      order: 0;
      margin-right: auto;
      flex-shrink: 0;
    }
    .btn-cerrar-sesion:hover {
      background: rgba(255, 0, 0, 0.4);
      transform: translateY(-2px);
      border-color: #ff4444;
    }

    .panel-content { padding: 20px 16px; }

    /* ===== NAV TABS ===== */
    .navbar-reportes {
      background: #f0f6fa;
      border-radius: 60px;
      padding: 6px 10px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      justify-content: center;
      border: 1px solid #cbdde9;
    }
    .nav-item {
      background: transparent;
      border: none;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #1a5f7a;
      font-family: inherit;
      white-space: nowrap;
      flex: 0 1 auto;
    }
    .nav-item:hover { background: #dce8f0; }
    .nav-item.active {
      background: #1a5f7a;
      color: white;
      box-shadow: 0 2px 8px rgba(26,95,122,0.3);
    }

    /* ===== MÓDULOS ===== */
    .modulo-filtro {
      display: none;
      animation: fadeIn 0.25s ease;
    }
    .modulo-filtro.active-modulo { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .seccion-titulo { 
      font-size: 1.1rem; 
      color: #1a5f7a; 
      margin-bottom: 16px; 
      border-left: 4px solid #2c9cd4;
      padding-left: 12px;
      font-weight: 600;
    }
    .mensaje-vacio { 
      text-align: center; 
      color: #7f8c8d; 
      padding: 32px; 
      background: #f9fafb;
      border-radius: 10px;
    }
    .loader {
      border: 4px solid #e0e7ed;
      border-top: 4px solid #1a5f7a;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      animation: spin 0.9s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .cargando-mensaje {
      text-align: center;
      color: #1a5f7a;
      padding: 24px;
      font-weight: 500;
      background: #f0f6fa;
      border-radius: 12px;
    }
    .resultado-item {
      background: #f9fdf9;
      border-left: 4px solid #2c6e49;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      word-break: break-word;
    }
    .admin-botones {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn-primario {
      background: #1a5f7a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.9rem;
    }
    .btn-primario:hover { background: #104a60; transform: scale(0.97); }
    .btn-secundario {
      background: #eef2f7;
      color: #1f5e7a;
      border: 1px solid #cbdde9;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.9rem;
    }
    .btn-secundario:hover { background: #e2eaf1; }
    .btn-imprimir {
      background: #764ba2;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      transition: 0.1s;
    }
    .btn-imprimir:hover { opacity: 0.8; transform: scale(0.95); }
    .btn-whatsapp {
      background: #25D366;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      transition: 0.1s;
    }
    .btn-whatsapp:hover { opacity: 0.8; transform: scale(0.95); }

    /* ===== TABLA RESPONSIVE ===== */
    .tabla-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 6px 0;
      border-radius: 12px;
      border: 1px solid #e0e7ed;
      background: white;
    }
    table { 
      width: 100%; 
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 500px;
    }
    th { 
      background: #1a5f7a; 
      color: white; 
      padding: 10px 10px; 
      text-align: left;
      white-space: nowrap;
      font-size: 0.8rem;
    }
    td { 
      padding: 10px 10px; 
      border-bottom: 1px solid #eaeef3;
      word-break: break-word;
      font-size: 0.8rem;
      vertical-align: middle;
    }
    tr:hover { background: #f5f8fc; }
    tr:last-child td { border-bottom: none; }

    /* ===== MODAL ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1100;
      padding: 16px;
    }
    .modal-contenido {
      background: white;
      border-radius: 28px;
      width: 100%;
      max-width: 750px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 25px 60px rgba(0,0,0,0.2);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      background: white;
      border-radius: 28px 28px 0 0;
      z-index: 10;
    }
    .modal-header h3 { color: #1a5f7a; font-size: 1.2rem; }
    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid #e0e7ed;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      background: white;
      border-radius: 0 0 28px 28px;
    }
    .modal-footer button { flex: 1 1 auto; min-width: 80px; }

    .campo { margin-bottom: 16px; }
    .campo label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1a5f7a;
      font-size: 0.85rem;
    }
    .campo input, .campo select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d0d9e3;
      border-radius: 12px;
      font-size: 0.9rem;
      transition: 0.15s;
      background: white;
    }
    .campo input:focus, .campo select:focus {
      outline: none;
      border-color: #1a5f7a;
      box-shadow: 0 0 0 3px rgba(26,95,122,0.15);
    }
    .error-input {
      border: 2px solid #c0392b !important;
      background: #ffe8e5 !important;
    }

    .checkbox-group {
      background: #f9f9f9;
      padding: 12px;
      border: 1px solid #dce4ec;
      border-radius: 14px;
      max-height: 240px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 4px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 10px;
      background: white;
      transition: all 0.2s ease;
    }
    .checkbox-item:hover { background: #e8f0fe; }
    .checkbox-item input {
      width: 16px;
      height: 16px;
      margin: 0;
      cursor: pointer;
      flex-shrink: 0;
      accent-color: #1a5f7a;
    }
    .checkbox-item label {
      margin: 0;
      cursor: pointer;
      font-weight: normal;
      flex: 1;
      font-size: 0.85rem;
      color: #2c3e50;
    }
    .modulo-card { background: #ffffff; border-radius: 20px; padding: 4px 0 0 0; }
    small { display: block; margin-top: 4px; color: #6c757d; font-size: 11px; }

    /* ===== GRID ===== */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 700px) {
      .panel-header { flex-direction: column; align-items: center; text-align: center; }
      .btn-cerrar-sesion { margin-right: 0; order: 0; }
      .panel-header h1 { font-size: 1.3rem; order: 1; }
      .panel-header p { order: 2; }
      .grid-2col { grid-template-columns: 1fr; gap: 8px; }
      .modal-contenido { max-width: 98%; }
    }

    @media (max-width: 500px) {
      body { padding: 8px; }
      .panel-content { padding: 14px 10px; }
      .navbar-reportes { border-radius: 30px; padding: 5px 6px; gap: 3px; }
      .nav-item { font-size: 0.65rem; padding: 5px 10px; }
      .btn-primario, .btn-secundario { font-size: 0.8rem; padding: 8px 14px; }
      .checkbox-group { grid-template-columns: 1fr 1fr; max-height: 180px; padding: 8px; }
      .checkbox-item { padding: 4px 6px; }
      .checkbox-item label { font-size: 0.75rem; }
      .modal { padding: 8px; }
      .modal-contenido { border-radius: 20px; max-width: 100%; }
      .modal-header { padding: 12px 14px; }
      .modal-header h3 { font-size: 1rem; }
      .modal-body { padding: 14px; }
      .modal-footer { padding: 10px 14px; }
      .modal-footer button { min-width: 60px; font-size: 0.75rem; padding: 6px 12px; }
    }

    @media (max-width: 400px) {
      .panel-header h1 { font-size: 1.1rem; }
      .btn-cerrar-sesion { font-size: 0.6rem; padding: 4px 8px; }
    }

    /* ===== TABLA EN TARJETAS PARA MÓVILES ===== */
    @media (max-width: 600px) {
      .tabla-wrapper {
        overflow-x: visible;
        border: none;
        background: transparent;
      }
      table {
        min-width: 0;
        display: block;
        border: none;
      }
      table thead {
        display: none;
      }
      table tbody {
        display: block;
      }
      table tr {
        display: block;
        background: white;
        border-radius: 14px;
        border: 1px solid #dce4ec;
        padding: 12px 14px;
        margin-bottom: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      }
      table tr:hover { background: white; }
      table td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px dashed #eaeef3;
        font-size: 0.78rem;
        gap: 8px;
      }
      table td:last-child { border-bottom: none; }
      table td::before {
        content: attr(data-label);
        font-weight: 600;
        color: #1a5f7a;
        flex-shrink: 0;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.2px;
        width: 40%;
      }
      table td:has(.btn-imprimir, .btn-whatsapp) {
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px;
      }
      table td:has(.btn-imprimir, .btn-whatsapp)::before {
        content: "Acciones";
        width: 40%;
      }
      .btn-imprimir, .btn-whatsapp {
        font-size: 0.6rem;
        padding: 3px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-biologico" id="bgCanvas"></div>

  <div class="container">
    <div class="panel">
      <div class="panel-header">
        <button id="btnCerrarSesion" class="btn-cerrar-sesion">🚪 Cerrar Sesión</button>
        <h1>🏥 Laboratorio Clínico</h1>
        <p>RECEPCIÓN · Registro de Órdenes y Entrega de Resultados</p>
      </div>
      <div class="panel-content">
        <div id="cargando" class="cargando-mensaje">
          <div class="loader"></div>
          Cargando...
        </div>
        
        <div id="contenidoPrincipal" style="display: none;">
          <div class="navbar-reportes">
            <button class="nav-item active" data-modulo="filtros">🔍 Filtro por Fecha/Estudio</button>
          </div>
          
          <div class="admin-botones">
            <button id="rec_botonAbrirModal" class="btn-primario">+ Registrar Orden de Examen</button>
          </div>

          <div id="rec_formulario">
            <div id="modulo-filtros" class="modulo-filtro active-modulo modulo-card">
              <div style="padding: 16px 14px; border: 1px solid #dce4ec; border-radius: 16px; background: #f8fbff;">
                <div style="font-weight: 600; color: #1a5f7a; margin-bottom: 12px;">🔍 Filtrar estudios por fecha</div>
                <div class="grid-2col">
                  <label style="display: flex; flex-direction: column; gap: 4px;">
                    Fecha
                    <input id="rec_filtro_fecha" type="date" style="padding: 9px 12px; border-radius: 10px; border: 1px solid #cbd5e1;">
                  </label>
                  <label style="display: flex; flex-direction: column; gap: 4px;">
                    Estudio
                    <select id="rec_filtro_tipo_estudio" style="padding: 9px 12px; border-radius: 10px; border: 1px solid #cbd5e1;">
                      <option value="">-- Seleccione un estudio --</option>
                    </select>
                  </label>
                </div>
                <button id="rec_botonFiltrarEstudios" class="btn-secundario" style="margin-top: 4px;">🔎 Buscar cantidad</button>
                <div id="rec_resultadoFiltroEstudios" style="margin-top: 16px;"></div>
              </div>
            </div>
          </div>
          
          <div style="margin-top: 28px;">
            <div class="seccion-titulo">🖨️ Resultados Listos para Impresión</div>
            <div id="rec_finalizados"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL REGISTRAR EXAMEN -->
  <div id="modalExamen" class="modal">
    <div class="modal-contenido">
      <div class="modal-header" style="background: #1a5f7a; color: white; border-radius: 28px 28px 0 0;">
        <h3 style="color: white;">📝 Registrar Orden Médica</h3>
      </div>
      <div class="modal-body">
        <div class="campo">
          <label>Cédula de Identidad: <span style="color:#c0392b;">*</span></label>
          <input type="text" id="modal_cedula" placeholder="Ej: V-12345678">
          <small>Presione Enter para buscar</small>
        </div>
        <div class="campo">
          <label>Nombre Completo: <span style="color:#c0392b;">*</span></label>
          <input type="text" id="modal_nombre" placeholder="Ej: Manuel Flores">
        </div>
        <div class="campo">
          <label>Teléfono: <span style="color:#c0392b;">*</span></label>
          <input type="tel" id="modal_telefono" placeholder="Ej: 04121234567">
          <small>Válidos: 0412, 0414, 0424, 0426, 0416, 0422</small>
        </div>
        <div class="campo">
          <label>Estudios Solicitados: <span style="color:#c0392b;">*</span></label>
          <div id="modal_checkboxes" class="checkbox-group"></div>
        </div>
        <div class="campo">
          <label>Total Provisional ($):</label>
          <input type="number" id="modal_precio" value="0" readonly style="background:#f0f0f0; font-weight:bold; color:#2e7d32;">
        </div>
        <div class="campo">
          <label>Método de Pago: <span style="color:#c0392b;">*</span></label>
          <select id="modal_metodoPago">
            <option value="Efectivo">💵 Efectivo</option>
            <option value="Transferencia">🏦 Transferencia</option>
            <option value="Pago Móvil">📱 Pago Móvil</option>
          </select>
        </div>
        <div class="campo" id="campo_referencia" style="display:none;">
          <label>Número de referencia: <span style="color:#c0392b;">*</span></label>
          <input type="text" id="modal_referencia" placeholder="Ej: 1234567890">
        </div>
      </div>
      <div class="modal-footer">
        <button id="modal_btnCancelar" class="btn-secundario" style="flex:1;">❌ Cancelar</button>
        <button id="modal_btnAceptar" class="btn-primario" style="flex:1;">✅ Registrar Orden</button>
      </div>
    </div>
  </div>

  <script>
    (function generarElementosBiologicos() {
      const canvas = document.getElementById('bgCanvas');
      if (!canvas) return;

      const add = (cls, styles) => {
        const d = document.createElement('div');
        d.className = cls;
        Object.assign(d.style, styles);
        canvas.appendChild(d);
      };

      // Glóbulos rojos
      [[160,8,3],[130,72,82],[180,78,8],[110,12,72],[150,48,42],[90,22,28],[70,88,52],[140,38,18],[100,32,62],[80,60,35]]
        .forEach(([s,t,l]) => add('globulo-rojo-bg', {width:s+'px', height:s+'px', top:t+'%', left:l+'%'}));

      // Bacterias

    (function verificarSesion() {
      const sesion = sessionStorage.getItem('labUser');
      if (!sesion) { window.location.href = 'index.html'; return; }
      try {
        const datos = JSON.parse(sesion);
        if (!datos.rol || !datos.timestamp || Date.now() - datos.timestamp > 28800000) {
          sessionStorage.removeItem('labUser');
          window.location.href = 'index.html';
          return;
        }
        // Permitir acceso a recepcionista y admin (ambos pueden ver esta vista)
        if (datos.rol !== 'recepcionista' && datos.rol !== 'admin') {
          sessionStorage.removeItem('labUser');
          window.location.href = 'index.html';
          return;
        }
        // Si es admin, también puede acceder
        console.log(`✅ Sesión iniciada como: ${datos.usuario} (${datos.rol})`);
      } catch(e) {
        sessionStorage.removeItem('labUser');
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('btnCerrarSesion').addEventListener('click', function() {
        sessionStorage.removeItem('labUser');
        window.location.replace('index.html');
      });

      window.history.pushState(null, '', window.location.href);
      window.addEventListener('popstate', function () {
        if (!sessionStorage.getItem('labUser')) {
          window.location.replace('index.html');
        } else {
          window.history.pushState(null, '', window.location.href);
        }
      });
    })();
  </script>

  <script type="module">
    import Cl_vRecepcion from "./dist/views/Cl_vRecepcion.js";
    import Cl_vExamen from "./dist/views/Cl_vExamen.js";
    import Cl_cExamen from "./dist/controllers/Cl_cExamen.js";
    import Cl_cLaboratorioRec from "./dist/controllers/Cl_cLaboratorioRec.js";
    import Cl_sEstudio from "./dist/services/Cl_sEstudio.js";
    
    function inicializarNavegacionPorTabs() {
      const botonesNav = document.querySelectorAll('.nav-item');
      const moduloFiltros = document.getElementById('modulo-filtros');
      
      function activarModulo(moduloId) {
        if (moduloFiltros) moduloFiltros.classList.remove('active-modulo');
        if (moduloId === 'filtros' && moduloFiltros) moduloFiltros.classList.add('active-modulo');
        botonesNav.forEach(btn => {
          const btnModulo = btn.getAttribute('data-modulo');
          if (btnModulo === moduloId) btn.classList.add('active');
          else btn.classList.remove('active');
        });
      }
      botonesNav.forEach(btn => {
        btn.addEventListener('click', () => {
          const moduloId = btn.getAttribute('data-modulo');
          if (moduloId) activarModulo(moduloId);
        });
      });
      activarModulo('filtros');
    }

    async function iniciarAplicacion() {
      try {
        await Cl_sEstudio.cargarCatálogo();
        document.getElementById("cargando").style.display = "none";
        document.getElementById("contenidoPrincipal").style.display = "block";
        inicializarNavegacionPorTabs();
        const vRec = new Cl_vRecepcion();
        const vExamen = new Cl_vExamen();
        const cExamen = new Cl_cExamen(vExamen);
        const cLaboratorioRec = new Cl_cLaboratorioRec(vRec, cExamen);
        console.log("✅ Aplicación Recepcionista iniciada");
      } catch (error) {
        console.error(error);
        document.getElementById("cargando").innerHTML = '<p style="color:red;">Error al cargar. <button onclick="location.reload()">Reintentar</button></p>';
      }
    }
    iniciarAplicacion();
  </script>
